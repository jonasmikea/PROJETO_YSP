<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Baixe vídeos e músicas do YouTube</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0c0e; --panel:#15151a; --panel2:#1a1a20; --line:#2a2a32;
  --text:#f4f4f6; --muted:#9a9aa6; --accent:#ff6a4d; --accent2:#ff4a2e;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app{position:relative;height:100%;display:grid;grid-template-columns:72px 1fr;grid-template-rows:1fr auto;gap:0 12px;padding:12px;
  background:radial-gradient(60% 50% at 50% 38%,#2a0f0b 0%,transparent 70%),var(--bg)}
/* sidebar */
.side{grid-row:1;display:flex;flex-direction:column;align-items:center;gap:14px;padding:18px 0;background:var(--panel);border:1px solid #1f1f26;border-radius:30px}
.side .spacer{flex:1}
.nav{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#d8d8de;transition:background .2s}
.nav:hover{background:#24242b}
.nav.active{background:#3a1f19;color:var(--accent)}
.nav.active svg{fill:none}
/* main */
.main{grid-row:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;min-height:0;overflow:hidden}
.winctl{position:absolute;top:8px;right:10px;display:flex;gap:18px;color:#ddd}
.winctl svg{width:16px;height:16px}
/* logo */
.logo{position:relative;width:min(300px,60vw);height:190px;margin-bottom:6px}
.wave{position:absolute;left:-60%;right:-60%;top:50%;height:120px;opacity:.9}
.wave path{fill:none;stroke:url(#g);stroke-width:2}
.yt{position:absolute;left:50%;top:0;width:210px;height:150px;transform:translateX(-50%) perspective(500px) rotateY(-14deg) rotateX(4deg);
  border-radius:34px;background:linear-gradient(145deg,#ff5a45,#c4160c 70%,#8d0d07);
  box-shadow:0 0 70px 10px rgba(255,60,30,.45),inset 0 0 0 2px rgba(255,170,150,.35),inset 0 -14px 24px rgba(0,0,0,.25);display:grid;place-items:center}
.yt::after{content:"";width:0;height:0;border-left:56px solid #ececf0;border-top:34px solid transparent;border-bottom:34px solid transparent;margin-left:12px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35));border-radius:4px}
h1{margin:6px 0 8px;font-size:clamp(26px,4.4vw,36px);font-weight:800;letter-spacing:-.01em;text-align:center}
h1 em{font-style:normal;color:var(--accent)}
.sub{margin:0 0 26px;color:var(--muted);font-size:17px;text-align:center}
/* search */
.search{display:flex;align-items:center;gap:12px;width:min(880px,100%);padding:8px 8px 8px 20px;background:var(--panel);border:1px solid var(--line);border-radius:18px;transition:border-color .2s}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:16px;padding:10px 0}
.search input::placeholder{color:#7d7d89}
.clear{color:var(--muted);width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.clear:hover{color:var(--text)}
.go{width:70px;height:46px;border-radius:12px;background:linear-gradient(180deg,#ff7a5c,var(--accent2));display:grid;place-items:center;color:#fff;box-shadow:0 6px 18px rgba(255,80,50,.35)}
.go:active{transform:scale(.97)}
.go svg{width:24px;height:24px}
.formats{display:flex;gap:14px;margin-top:28px;flex-wrap:wrap;justify-content:center}
.fmt{display:flex;align-items:center;gap:12px;padding:14px 20px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:#d0d0d8;transition:border-color .2s,background .2s}
.fmt svg{width:22px;height:22px}
.fmt[aria-pressed="true"]{border-color:var(--accent);background:#1f1613;color:var(--text)}
.fmt[aria-pressed="true"] svg{color:var(--accent)}
.status{min-height:22px;margin-top:16px;font-size:14px;color:var(--muted);text-align:center}
.status.err{color:#ff8a78}
/* player */
.player{grid-column:1/-1;grid-row:2;margin-top:12px;height:76px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:0 20px;background:var(--panel);border:1px solid #1f1f26;border-radius:18px}
.track{display:flex;align-items:center;gap:14px;min-width:0}
.cover{width:50px;height:50px;border-radius:10px;flex:none;background:radial-gradient(circle at 35% 30%,#ffb04a,#8a2be2 55%,#1a0b2e)}
.meta{min-width:0}.meta b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px}
.meta span{font-size:12px;color:var(--muted)}
.ic{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:#d8d8de}
.ic:hover{color:#fff}.ic svg{width:18px;height:18px}
.ic.on{color:var(--accent)}.ic.on svg{fill:var(--accent)}
.ctrl{display:flex;align-items:center;gap:26px}
.play{width:50px;height:50px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;box-shadow:0 0 18px rgba(255,100,70,.3)}
.play svg{width:22px;height:22px;fill:#fff;stroke:#fff}
.right{display:flex;align-items:center;gap:16px;justify-content:flex-end}
input[type=range]{-webkit-appearance:none;appearance:none;width:130px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--accent) var(--v,55%),#3a3a42 var(--v,55%));outline-offset:6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--accent);border:0}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--accent);border:0}
.time{font-size:11px;color:#c8c8d0;background:#222229;padding:8px 14px;border-radius:12px}
.toast{position:absolute;left:50%;bottom:110px;transform:translate(-50%,20px);background:#25252c;border:1px solid var(--line);padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;padding:8px;gap:8px}
  .side{grid-row:1;flex-direction:row;justify-content:space-around;padding:6px 10px;border-radius:22px}
  .side .spacer{display:none}
  .main{grid-row:2;overflow:auto;justify-content:flex-start;padding-top:30px}
  .winctl,.right .time,.right input,.track .ic,.ctrl .hide-m{display:none}
  .player{grid-row:3;grid-template-columns:1fr auto;padding:0 12px}
  .logo{height:150px}.yt{width:160px;height:115px}.yt::after{border-left-width:42px;border-top-width:26px;border-bottom-width:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ff3b1d" stop-opacity="0"/><stop offset=".5" stop-color="#ff4a2e"/><stop offset="1" stop-color="#ff3b1d" stop-opacity="0"/></linearGradient>
</defs></svg>

<div class="app">
  <nav class="side" aria-label="Navegação">
    <button class="nav" title="Início" aria-label="Início"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3z"/></svg></button>
    <button class="nav" title="Músicas" aria-label="Músicas"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3" fill="currentColor"/><circle cx="17" cy="16" r="3" fill="currentColor"/></svg></button>
    <button class="nav" title="Playlists" aria-label="Playlists"><svg viewBox="0 0 24 24"><path d="M3 6h14M3 11h14M3 16h8"/><path d="M19 11v7"/><circle cx="17" cy="18" r="2" fill="currentColor"/></svg></button>
    <button class="nav active" title="Downloads" aria-label="Downloads" aria-current="page"><svg viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg></button>
    <button class="nav" title="Atualizar" aria-label="Atualizar"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5"/></svg></button>
    <span class="spacer"></span>
    <button class="nav" title="Configurações" aria-label="Configurações"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </nav>

  <main class="main">
    <div class="winctl" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
      <svg viewBox="0 0 24 24"><rect x="5" y="7" width="12" height="12" rx="1"/><path d="M8 7V5h11v11h-2"/></svg>
      <svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5 5 19"/></svg>
    </div>

    <div class="logo" aria-hidden="true">
      <svg class="wave" viewBox="0 0 600 120" preserveAspectRatio="none"><path d="M0 90C90 90 130 20 220 40S330 110 420 70 520 30 600 40"/><path d="M0 100C100 95 150 40 240 55S340 115 430 85 530 50 600 60" opacity=".5"/></svg>
      <div class="yt"></div>
    </div>

    <h1>Baixe <em>vídeos</em> e <em>músicas</em> do YouTube</h1>
    <p class="sub">Cole o link abaixo para baixar ou reproduzir diretamente.</p>

    <div class="search">
      <svg viewBox="0 0 24 24" style="width:26px;height:26px;color:#d8d8de;flex:none"><path d="M10 14a4 4 0 0 0 5.7 0l3.5-3.5a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3.5 3.5a4 4 0 0 0 5.7 5.7l1-1"/></svg>
      <input id="url" type="url" inputmode="url" placeholder="Cole aqui o link do YouTube..." aria-label="Link do YouTube" autocomplete="off">
      <button class="clear" id="clear" aria-label="Limpar link"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <button class="go" id="go" aria-label="Buscar"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    </div>

    <div class="formats" role="group" aria-label="Formato">
      <button class="fmt" data-f="mp3" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>Música (MP3)</button>
      <button class="fmt" data-f="mp4" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m10 9 5 3-5 3z" fill="currentColor"/></svg>Vídeo (MP4)</button>
    </div>
    <div class="status" id="status" role="status"></div>
    <div class="toast" id="toast"></div>
  </main>

  <footer class="player">
    <div class="track">
      <div class="cover"></div>
      <div class="meta"><b>AGONIA | Springtr...</b><span>7 Minutos</span></div>
      <button class="ic" aria-label="Expandir"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></svg></button>
      <button class="ic" id="like" aria-label="Curtir"><svg viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg></button>
    </div>
    <div class="ctrl">
      <button class="ic hide-m" aria-label="Aleatório"><svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
      <button class="ic" aria-label="Anterior"><svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:currentColor"><path d="M6 5v14M18 5v14l-10-7z"/></svg></button>
      <button class="play" id="play" aria-label="Reproduzir"><svg viewBox="0 0 24 24" id="pi"><path d="M7 4v16l13-8z"/></svg></button>
      <button class="ic" aria-label="Próxima"><svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:currentColor"><path d="M18 5v14M6 5v14l10-7z"/></svg></button>
      <button class="ic hide-m" aria-label="Repetir"><svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg></button>
    </div>
    <div class="right">
      <svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none;width:18px;height:18px;color:#ddd"><path d="M3 9v6h4l5 4V5L7 9zM16 8a5 5 0 0 1 0 8" stroke="currentColor" stroke-width="2" fill="none"/></svg>
      <input type="range" id="vol" min="0" max="100" value="55" aria-label="Volume">
      <span class="time">0:00 / 0:00</span>
      <button class="ic" aria-label="Fila"><svg viewBox="0 0 24 24"><path d="M3 6h14M3 11h14M3 16h8"/><path d="M19 11v7"/><circle cx="17" cy="18" r="2" fill="currentColor"/></svg></button>
      <button class="ic" aria-label="Tela cheia" id="fs"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
  </footer>
</div>

<script>
const $=s=>document.querySelector(s);
const url=$('#url'),status=$('#status'),toast=$('#toast');
let format='mp3',playing=false,tt;

function say(msg,err){status.textContent=msg;status.classList.toggle('err',!!err)}
function pop(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('show'),2200)}
function validYT(v){try{const u=new URL(v);return /(^|\.)youtube\.com$|^youtu\.be$/.test(u.hostname)}catch{return false}}

document.querySelectorAll('.fmt').forEach(b=>b.addEventListener('click',()=>{
  format=b.dataset.f;
  document.querySelectorAll('.fmt').forEach(x=>x.setAttribute('aria-pressed',x===b));
}));
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.nav').forEach(x=>{x.classList.remove('active');x.removeAttribute('aria-current')});
  b.classList.add('active');b.setAttribute('aria-current','page');
}));
$('#clear').addEventListener('click',()=>{url.value='';say('');url.focus()});

function submit(){
  const v=url.value.trim();
  if(!v){say('Cole um link do YouTube para continuar.',true);return}
  if(!validYT(v)){say('Esse link não parece ser do YouTube. Confira e tente de novo.',true);return}
  say('Link válido. Formato selecionado: '+(format==='mp3'?'Música (MP3)':'Vídeo (MP4)')+'.');
  pop('Pronto: conecte aqui a sua função de download.');
  /* TODO: chame aqui o seu backend/API, ex.: fetch('/api/download',{method:'POST',body:JSON.stringify({url:v,format})}) */
}
$('#go').addEventListener('click',submit);
url.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});

$('#play').addEventListener('click',()=>{
  playing=!playing;
  $('#pi').innerHTML=playing?'<path d="M7 4h4v16H7zM13 4h4v16h-4z"/>':'<path d="M7 4v16l13-8z"/>';
  $('#play').setAttribute('aria-label',playing?'Pausar':'Reproduzir');
});
$('#like').addEventListener('click',e=>e.currentTarget.classList.toggle('on'));
const vol=$('#vol');
vol.addEventListener('input',()=>vol.style.setProperty('--v',vol.value+'%'));
vol.style.setProperty('--v','55%');
$('#fs').addEventListener('click',()=>{
  try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}
});
</script>
</body>
</html>
